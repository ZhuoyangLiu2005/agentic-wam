# @package _global_
# RoboTwin code-stream finetune on codegen/sim data. Generated by robotwin/dataprep/prepare.py;
# edit freely — only `override /data` ties it to the generated data config.
# Recipe: 14-D absolute joint actions, no code memory, no-history code prompt (progress comes from the ViT prefix),
# AgenticWAM model, cosine lr 2e-4, wd 1e-2. Launch:
#     bash scripts/train_robotwin.sh <this file's stem> [batch_size=4 max_steps=15000]
defaults:
  - override /data: __DATA__
  - override /model: agenticwam_cosmos
  - _self_
batch_size: 4
num_workers: 8
model:
  code_model_name: __CODE_MODEL__          # SDAR-1.7B code body
  action_dim: 14
  proprio_dim: 14
  n_cameras: 3
  mot_checkpoint_mixed_attn: true
  use_code_expert: true
  code_objective: joint
  code_block_length: 4
  code_vision: qwen3vl_prefix
  code_vision_path: __CODE_VISION_PATH__
  code_memory: false
  max_code_tokens: __MAX_CODE_TOKENS__   # longest training prompt (instruction + helper library + slice) over the datasets, rounded up; the RoPE cap follows it
  infer_code_tokens: 64
lr_scheduler_type: "cosine"
learning_rate: 2e-4
num_epochs: 1
max_steps: 15000
save_every: 2500
log_every: 20
eval_every: 999999
gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null
foundation_ckpt: __FOUNDATION_CKPT__
