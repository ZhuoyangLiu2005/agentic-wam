# Released WAM checkpoint: official demos with appearance augmentation, 50 tasks, 14-D absolute joints.
checkpoint:   ${robotwin_release_dir}/wam/step_200000.pt
eval_task:    robotwin_wam                    # the training config; it also sets the 128-token eval canvas
action_space: ""                              # 14-D joint: direct qpos, no IK
action_dim:   14
proprio_dim:  14
task_assets:  false                           # trained on the RoboTwin 2.0 dataset's skill-prompt caches, not on
                                              # configs/robotwin/tasks/ preambles: WAM eval only, no hybrid
dataset_stats: ${dataset_stats}
instruction_type: seen                       # episode's own instruction; --instruction-type unseen overrides
gen_tokens:   128
nis:          20
replan:       24
use_code_expert: true
code_model:   ${code_model}
env:                                          # exported into the eval process
  AGENTICWAM_TASK_INSTRUCTION_MAP: ""          # trained on episode instructions, not a canonical rewrite
  AGENTICWAM_TASK_SKILL_PROMPT: ${robotwin_release_dir}/task_skill_prompt.json
  AGENTICWAM_EVAL_PREPROC: parity_crop
  AGENTICWAM_EVAL_PREPROC_CROP: "0.95"
  AGENTICWAM_SKILL_PROMPT_ONLY: ""
  AGENTICWAM_SLICE_MODE: ""
  AGENTICWAM_SLICE_SUMMARY: ""
  AGENTICWAM_CONF_THRESH: "0"
  AGENTICWAM_REVEAL_CAP: "9999"
  AGENTICWAM_NN_REPAIR: "0"
