# Model preset: robotwin_wam (RoboTwin 2.0 official data, 50 tasks, 14-D joint). `run` (site.yaml) is the
# run directory or released checkpoint directory. Use with robotwin/eval/benchmark.py --model robotwin_wam.
run:          ${robotwin_wam_run}
eval_task:    robotwin_wam                    # the training config; it also sets the 128-token eval canvas
action_space: ""                              # 14-D joint: direct qpos, no IK
action_dim:   14
proprio_dim:  14
task_assets:  false                           # trained on the RoboTwin 2.0 dataset's skill-prompt caches, not on
                                              # configs/robotwin/tasks/ preambles: WAM eval only, no hybrid
dataset_stats: ${dataset_stats}
nis:          20
replan:       24
use_code_expert: true
code_model:   ${code_model}
env:                                          # exported into the eval process
  AGENTICWAM_TASK_INSTRUCTION_MAP: ${robotwin_official_labels}/task_instruction.json
  AGENTICWAM_TASK_SKILL_PROMPT: ${robotwin_official_labels}/task_skill_prompt.json
