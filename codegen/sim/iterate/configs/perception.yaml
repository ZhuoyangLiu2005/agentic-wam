# RoboTwin blocks_ranking_size / demo_randomized — PERCEPTION (Molmo+SAM3 grounding, real
# GraspNet synthesis). Needs vision servers up: Molmo :8122, SAM3 :8114.
# Use after the privileged config validates the integration.
#
# Seed policy: debug seeds are 101-105 clean
# and 151-155 randomized (see the *_randomized.yaml sibling); validation seeds
# 201-210 / 251-260 are LOCKED one-shot — never run them while iterating.
# resume_idx: 151 + --args.total-trials 155 runs exactly seeds 151-155.
#
# Usage (source env.sh first: ROBOTWIN_PY carries sapien/mplib/curobo, PYTHONPATH has capsim):
#   cd codegen/sim && source env.sh
#   $ROBOTWIN_PY \
#     -m capsim.envs.launch \
#     --args.config-path iterate/configs/perception.yaml \
#     --args.total-trials 155

env:
  _target_: capsim.envs.tasks.robotwin.robotwin_env.RoboTwinCodeEnv
  cfg:
    _target_: capsim.envs.tasks.base.CodeExecEnvConfig
    low_level:
      _target_: capsim.envs.simulators.robotwin.RoboTwinTask
      task_name: blocks_ranking_size
      task_config: demo_randomized
      embodiment: aloha-agilex
      privileged: false
    privileged: false
    apis:
      - RoboTwinGripperApiTraced
    prompt: |
      You are controlling a dual-arm ALOHA-AgileX robot in the RoboTwin simulator with the API described below.
      Goal: Complete the task described under "TASK GOAL" above.
      hand is the string "left" or "right". All poses are world-frame (position in metres, quaternion WXYZ).
      Motion functions return False when motion planning fails. Perception functions can raise an exception on a failed grounding. The two arms do NOT avoid each other automatically.
      You may write python code comments for reasoning but ONLY write the executable Python code and do not write it in code fences.
      The functions (APIs) below are already imported to the environment. If you want to use numpy, you need to import it explicitly.

    multi_turn_prompt: |
      The following code blocks were just executed:
      ```python
      {executed_code}
      ```
      The current console stdout is:
      ```
      {console_stdout}
      ```
      The current console stderr is:
      ```
      {console_stderr}
      ```
      If there were no errors during compilation or execution, the console stderr will be empty. If there were errors, consider regenerating the code.
      Please respond with EXACTLY ONE of the following:
      - The word 'REGENERATE' followed immediately by new Python code in a fenced code block (```python...```) if you want to write new code.
      - The word 'FINISH' if the task appears to be complete

api_servers: []

record_video: true
output_dir: ./outputs/validation/replay_perception

resume_idx: 151
trials: 155
num_workers: 1
